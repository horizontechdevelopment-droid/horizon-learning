site_name: Horizon Learning
site_description: Beginner-friendly learning guides from Horizon Tech Development
site_author: Horizon Tech Development
site_url: https://learn.horizontechdevelopment.com/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md

  - Cybersecurity First Steps:
      - Course Overview: cybersecurity-first-steps/index.md

      - "Module 1: Getting Started":
          - "Lesson 1: Learning Path": cybersecurity-first-steps/getting-started/learning-path.md
          - "Lesson 2: What Is Cybersecurity?": cybersecurity-first-steps/getting-started/what-is-cybersecurity.md
          - "Lesson 3: Safety and Permission": cybersecurity-first-steps/getting-started/safety-and-permission.md

      - "Module 2: Kali Linux":
          - "Lesson 4: What Is Kali?": cybersecurity-first-steps/kali/what-is-kali.md
          - "Lesson 5: Download Kali": cybersecurity-first-steps/kali/download-kali.md
          - "Lesson 6: Create a Live USB": cybersecurity-first-steps/kali/create-live-usb.md
          - "Lesson 7: Starting Kali for the First Time": cybersecurity-first-steps/kali/first-boot.md
          - "Lesson 8: Keeping Kali up to date": cybersecurity-first-steps/kali/keeping-kali-up-to-date.md
          - "Lesson 9: Shutting Down Kali Safely": cybersecurity-first-steps/kali/shutting-down-kali.md

      - "Module 3: Learning Your Way Around Linux":
          - "Welcome": cybersecurity-first-steps/linux-basics/index.md
          - "Guide 10: Terminal Basics": cybersecurity-first-steps/linux-basics/terminal-basics.md
          - "Guide 11: Files and Folders": cybersecurity-first-steps/linux-basics/files-and-folders.md
          - "Guide 12: Useful Commands": cybersecurity-first-steps/linux-basics/useful-commands.md
          - "Guide 13: Finding Help": cybersecurity-first-steps/linux-basics/finding-help.md
          - "Guide 14: Creating and Managing Files": cybersecurity-first-steps/linux-basics/creating-and-managing-files.md
          - "Guide 15: Understanding Permissions": cybersecurity-first-steps/linux-basics/understanding-permissions.md
          - "Module 3 Review": cybersecurity-first-steps/linux-basics/module-review.md
          - "Module 3 Milestone": cybersecurity-first-steps/linux-basics/module-milestone.md

      - "Module 4: Understanding Networks":
          - "Welcome": cybersecurity-first-steps/networking/index.md
          - "Guide 16: What Is a Network?": cybersecurity-first-steps/networking/what-is-a-network.md
          - "Guide 17: Wi-Fi vs Ethernet": cybersecurity-first-steps/networking/wifi-vs-ethernet.md
          - "Guide 18: Understanding IP Addresses": cybersecurity-first-steps/networking/understanding-ip-addresses.md
          - "Guide 19: Understanding Ports": cybersecurity-first-steps/networking/understanding-ports.md
          - "Guide 20: How Devices Find Each Other (DNS)": cybersecurity-first-steps/networking/how-devices-find-each-other.md
          - "Guide 21: Understanding Your Home Network": cybersecurity-first-steps/networking/understanding-your-home-network.md
          - "Module 4 Review": cybersecurity-first-steps/networking/module-review.md
          - "Module 4 Milestone": cybersecurity-first-steps/networking/module-milestone.md

      - "Module 5: Your First Security Tools":
          - "Lesson 16: Kali Tools Overview": cybersecurity-first-steps/tools/kali-tools-overview.md
          - "Lesson 17: Nmap": cybersecurity-first-steps/tools/nmap.md
          - "Lesson 18: Wireshark": cybersecurity-first-steps/tools/wireshark.md

      - "Module 6: Safe Practice Labs":
          - "Lesson 19: Home Wi-Fi Security Check": cybersecurity-first-steps/labs/home-wifi-security-check.md
          - "Lesson 20: First Nmap Scan": cybersecurity-first-steps/labs/first-nmap-scan.md
          - "Lesson 21: Beginner Lab Roadmap": cybersecurity-first-steps/labs/beginner-lab-roadmap.md

      - Resources:
          - Beginner Progress Checklist: cybersecurity-first-steps/checklists/beginner-progress-checklist.md
          - Glossary: cybersecurity-first-steps/glossary.md

  - About: about.md
  - Teaching Philosophy: teaching-philosophy.md
  - Learning Framework: learning-framework.md
  - Downloads: downloads.md
  - Updates: updates.md
  - Changelog: changelog.md
  - Content Roadmap: content-roadmap.md
  - Style Guide: style-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
